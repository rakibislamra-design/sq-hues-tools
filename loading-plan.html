<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Daily loading plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: one screen. Slim header + one control bar, a single list that scrolls inside, sticky totals at the bottom. */
:root{
  --qp:#664356; --qp-ink:#ffffff; --qp-soft:#EFECED; --qp-mid:#D2C7CB; --qp-line:#B29EA6;
  --tan-soft:#ECE6E3; --blue:#366083; --blue-soft:#CCD0DB; --red:#AF4F5A; --red-soft:#E7D1CE; --ok:#3c7a5a; --ok-soft:#d8e8de;
  --bg:#f6f3f4; --surface:#ffffff; --raise:#faf8f9; --fg:#2a1f25; --muted:#6e6268; --line:#e4dbdf;
  --accent:#664356; --accent-ink:#ffffff; --sel:#f1e7ec; --sel-line:#957B87;
  --f-ui:Calibri,"Carlito","Segoe UI",system-ui,sans-serif; --f-mono:Calibri,"Carlito","Segoe UI",system-ui,sans-serif;
  --cols:minmax(64px,.55fr) 262px minmax(70px,.75fr) minmax(90px,1.05fr) minmax(100px,1.35fr) minmax(80px,.9fr) 34px 26px 48px minmax(70px,.75fr);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --qp:#4a3040; --qp-ink:#f3eaee; --qp-soft:#2c2228; --qp-mid:#4b3a43; --qp-line:#7C5D6D;
  --tan-soft:#3a302c; --blue:#9fb3d1; --blue-soft:#273445; --red:#e0959c; --red-soft:#4a2a2e; --ok:#8fcaa8; --ok-soft:#24392d;
  --bg:#1a1417; --surface:#211a1e; --raise:#272025; --fg:#f0e8ec; --muted:#b4a6ad; --line:#3a2f35;
  --accent:#c9a7b8; --accent-ink:#1a1417; --sel:#33262d; --sel-line:#957B87; color-scheme:dark}}
:root[data-theme="dark"]{
  --qp:#4a3040; --qp-ink:#f3eaee; --qp-soft:#2c2228; --qp-mid:#4b3a43; --qp-line:#7C5D6D;
  --tan-soft:#3a302c; --blue:#9fb3d1; --blue-soft:#273445; --red:#e0959c; --red-soft:#4a2a2e; --ok:#8fcaa8; --ok-soft:#24392d;
  --bg:#1a1417; --surface:#211a1e; --raise:#272025; --fg:#f0e8ec; --muted:#b4a6ad; --line:#3a2f35;
  --accent:#c9a7b8; --accent-ink:#1a1417; --sel:#33262d; --sel-line:#957B87; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13.5px/1.4 var(--f-ui);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px;gap:6px}
header{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;background:var(--qp);color:var(--qp-ink);border-radius:8px;padding:6px 12px}
header h1{margin:0;font-size:15px;font-weight:700;white-space:nowrap}
header .file{font-size:11.5px;opacity:.85;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header .sp{flex:1}
#busy{font-size:11.5px}
.hbtn{font:600 12px var(--f-ui);border:1px solid rgba(255,255,255,.45);color:var(--qp-ink);border-radius:5px;padding:3px 9px;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.12)}
.mcs{display:flex;gap:3px;flex-wrap:wrap}
.mc{font:600 12px var(--f-ui);border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--qp-ink);border-radius:5px;padding:3px 8px;cursor:pointer;white-space:nowrap}
.mc small{font-weight:500;opacity:.8;margin-left:3px;font-variant-numeric:tabular-nums}
.mc.on{background:var(--qp-ink);color:var(--qp);border-color:var(--qp-ink)}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:var(--surface)}
.seg button{font:500 11.5px var(--f-ui);border:0;background:transparent;color:var(--muted);padding:3px 8px;cursor:pointer}
.seg button.on{background:var(--qp-soft);color:var(--fg);font-weight:700}
input[type=search]{font:12px var(--f-ui);border:1px solid var(--line);border-radius:5px;padding:3px 8px;background:var(--surface);color:var(--fg);flex:1 1 160px;min-width:120px}
.btn{font:600 12px var(--f-ui);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:5px;padding:3px 10px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{color:var(--red)}
.btn.hot{border-color:var(--accent);box-shadow:0 0 0 2px var(--sel)}
.btn .badge{display:inline-block;margin-left:5px;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 5px;font-size:10.5px}
button:focus-visible,input:focus-visible,.hbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.list{flex:1;min-height:0;overflow:auto}
.ln.hd>span:not(.lh){position:relative;overflow:visible}
.hd>span>b{display:block;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.rz{position:absolute;top:-4px;bottom:-4px;right:-7px;width:9px;cursor:col-resize;z-index:3}
.rz::after{content:"";position:absolute;left:4px;top:3px;bottom:3px;border-left:1px solid var(--line)}
.rz:hover::after,.rz.on::after{border-left:2px solid var(--accent)}
.cb,.hd{min-width:max-content}
.ln{display:grid;grid-template-columns:var(--cols);gap:7px;align-items:center;min-height:24px}
.ln>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hd{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);font:600 10px var(--f-ui);text-transform:uppercase;letter-spacing:.35px;color:var(--muted);padding:7px 12px 6px 104px}
.hd .lh{position:absolute;left:14px;z-index:3}
.cb{display:grid;grid-template-columns:104px minmax(0,1fr);border-bottom:1px solid var(--line);background:var(--surface);cursor:pointer}
.cb:hover{background:var(--raise)}
.cb.pl{background:var(--sel)}
.cb.pl:hover{background:var(--sel)}
.cb.drag{opacity:.4}.cb.over{box-shadow:inset 0 3px 0 var(--accent)}
.ns{width:24px;font-size:11.5px;color:var(--muted);text-align:center;flex:none;font-variant-numeric:tabular-nums}
.mct{font-size:10.5px;color:var(--muted);background:var(--qp-soft);border-radius:3px;padding:0 4px;flex:none}
.dv.mcg{background:var(--raise);color:var(--muted);padding:3px 14px;font-size:10px}
.lead{display:flex;align-items:center;gap:6px;padding:2px 0 2px 12px;overflow:hidden;font-variant-numeric:tabular-nums;white-space:nowrap}
.tick{width:14px;height:14px;border:1.5px solid var(--qp-line);border-radius:4px;display:inline-block;flex:none}
.cb:hover .tick{border-color:var(--accent)}
.hdl{cursor:grab;color:var(--muted);font-size:12px;user-select:none;letter-spacing:-2px;margin-left:-6px}
.sn{width:34px;font:700 12px var(--f-mono);text-align:center;border:1px solid transparent;border-radius:4px;padding:1px;background:var(--surface);color:var(--accent)}
.sn:hover,.sn:focus{border-color:var(--sel-line)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex:none}
.dot.on{background:var(--ok)}
.kg{font-weight:700;font-size:12px}
.ld{font-size:11px;color:var(--muted)}
.ld.bad{color:var(--red);font-weight:700}
.lines{padding:2px 12px 2px 0;min-width:0}
.lines .ln+.ln{border-top:1px dotted var(--line)}
.bn{font:400 13px var(--f-mono);font-variant-numeric:tabular-nums}
.mut{color:var(--muted)}
.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.bg{display:inline-block;min-width:18px;text-align:center;font:700 10.5px var(--f-mono);border-radius:3px}
.bg.B{background:var(--qp-mid);color:var(--fg)}.bg.G{background:var(--blue-soft);color:var(--blue)}
.ok{color:var(--ok);font-weight:600}.no{color:var(--red);font-weight:600}
.dv{font:700 10.5px var(--f-ui);text-transform:uppercase;letter-spacing:.5px;color:var(--accent);padding:6px 14px 5px;background:var(--raise);border-bottom:1px solid var(--line)}
.empty{color:var(--muted);text-align:center;padding:14px;font-size:12px}
.foot{display:flex;flex-wrap:wrap;gap:4px 16px;padding:5px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--raise)}
.foot b{color:var(--fg);font-variant-numeric:tabular-nums}
.chk{display:inline-flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;user-select:none}
input[type=checkbox]{accent-color:var(--accent);margin:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(40px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:7px 12px;border-radius:6px;font-size:12.5px;max-width:calc(100% - 32px);z-index:20}
.confirm{display:inline-flex;gap:4px;align-items:center;font-size:12px;color:var(--red)}

.hb{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap}
.hb2{font:600 12px var(--f-ui);border:1px solid rgba(255,255,255,.4);background:transparent;color:var(--qp-ink);border-radius:5px;padding:3px 9px;cursor:pointer;white-space:nowrap}
.hb2:hover{background:rgba(255,255,255,.12)}
.hb2:disabled{opacity:.45;cursor:default;background:transparent}
.hb2.home{font-size:12.5px}
.hb2.pri{background:var(--qp-ink);color:var(--qp);border-color:var(--qp-ink)}
.hb2.hot{background:rgba(255,255,255,.2);border-color:var(--qp-ink)}
.hb2 .badge{display:inline-block;margin-left:5px;background:var(--qp-ink);color:var(--qp);border-radius:8px;padding:0 5px;font-size:10.5px}
header .confirm{color:var(--qp-ink)}
.hd b{cursor:pointer}
.hd b::after{content:" ▾";opacity:.55;font-size:9px}
.hd b.f{color:var(--accent)}
.hd b.f::after{content:" ▼";opacity:1}
.hd b:hover{color:var(--fg)}
#dlgW{position:fixed;inset:0;z-index:40;background:rgba(30,20,26,.28);display:flex;align-items:center;justify-content:center;padding:16px}
#dlgW[hidden]{display:none}
#dlg{background:var(--surface);border:1px solid var(--line);border-top:4px solid #C98A1B;border-radius:8px;box-shadow:0 12px 36px rgba(0,0,0,.22);width:560px;max-width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:12px 14px;font-size:12.5px;display:flex;flex-direction:column;gap:8px}
#dlg.red{border-top-color:var(--red)}
#dlg h3{margin:0;font:700 14px var(--f-ui);color:#9A6A12}
#dlg.red h3{color:var(--red)}
#dlg .note{background:#FBF3E2;color:#7A5410;border-radius:5px;padding:5px 8px}
#dlg .over{background:var(--red-soft);color:var(--red);border-radius:5px;padding:5px 8px;font-weight:600}
#dlg table{border-collapse:collapse;width:100%;font-size:11.5px}
#dlg th,#dlg td{border-bottom:1px solid var(--line);padding:3px 5px;text-align:right;white-space:nowrap}
#dlg th:first-child,#dlg td:first-child{text-align:left;white-space:normal}
#dlg th{font-weight:600;color:var(--muted);font-size:10.5px}
#dlg td.bad{color:var(--red);font-weight:700}
#dlg .acts{display:flex;justify-content:flex-end;gap:6px;margin-top:2px}
#dlg .btn.go{background:var(--red);border-color:var(--red);color:#fff}
#dlg .btn.go.amb{background:#C98A1B;border-color:#C98A1B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #dlg .note{background:#3a3020;color:#e8c98a}:root:not([data-theme="light"]) #dlg h3{color:#e8c98a}}
:root[data-theme="dark"] #dlg .note{background:#3a3020;color:#e8c98a}
#fp{position:fixed;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.18);width:260px;max-width:calc(100vw - 24px);padding:8px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
#fp[hidden]{display:none}
#fp input[type=search]{flex:none;width:100%;min-width:0;font:12.5px var(--f-ui);border:1px solid var(--line);border-radius:5px;padding:4px 8px;background:var(--raise);color:var(--fg)}
#fp .vals{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:5px;padding:4px 6px}
#fp label{display:flex;gap:6px;align-items:center;padding:1px 0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fp label[hidden]{display:none}
#fp .row{display:flex;gap:6px;justify-content:space-between}
#fp .ttl{font-weight:700;color:var(--accent)}

/* light theme for header + controls */
:root{--hdr-bg:#F6F2F4;--hdr-ink:#664356;--hdr-line:#D2C7CB;--sel:#F3ECF0;--sel-line:#D2C7CB}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hdr-bg:#2a2126;--hdr-ink:#e6dfe1;--hdr-line:#4b3a43;--sel:#2c2328}}
:root[data-theme="dark"]{--hdr-bg:#2a2126;--hdr-ink:#e6dfe1;--hdr-line:#4b3a43;--sel:#2c2328}
header{background:var(--hdr-bg)!important;color:var(--hdr-ink)!important;border:1px solid var(--hdr-line)}
.mc,.hb2,.hbtn{border-color:var(--hdr-line)!important;color:var(--hdr-ink)!important;background:var(--surface)!important}
.mc:hover,.hb2:hover,.hbtn:hover{border-color:var(--qp-line)!important}
.mc.on,.hb2.pri{background:var(--accent)!important;color:var(--accent-ink)!important;border-color:var(--accent)!important}
.mc.on small{color:var(--accent-ink)!important}
.hb2.hot{border-color:var(--accent)!important;box-shadow:0 0 0 2px var(--sel)}
.hb2 .badge{background:var(--accent)!important;color:var(--accent-ink)!important}
header .confirm{color:var(--red)!important}
.sn{color:var(--accent)}
.dv{background:var(--surface)}
.ed{font:inherit;color:var(--fg);border:1px solid transparent;background:transparent;padding:0 3px;width:100%;min-width:0;border-radius:3px;height:20px}
.ed:hover{border-color:var(--line);background:var(--surface)}
.ed:focus{border-color:var(--accent);background:var(--surface);outline:none}

/* clearer combo separation */
:root{--band:#F4F4F3;--sep:#D2C7CB;--pick:#E9DDE4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--band:#242224;--sep:#4a3c44;--pick:#3d2b36}}
:root[data-theme="dark"]{--band:#242224;--sep:#4a3c44;--pick:#3d2b36}
.cb{border-bottom:1px solid var(--sep)!important}
.cb.alt{background:var(--band)}
.cb.pl,.cb.pl.alt,.cb.pl:hover{background:var(--pick)!important;box-shadow:inset 4px 0 0 var(--accent)}
.cb:hover{background:var(--qp-soft)}
.lines .ln+.ln{border-top:1px dotted var(--line)!important}
.dv{border-top:1px solid var(--sep)}


/* soft palette: no solid fills, lighter tones */
:root{--s-red:#B8737B;--s-red-bg:#F7ECEC;--s-ok:#5E9277;--s-amb:#B08A4A;--s-amb-bg:#FAF4E8;--s-pick:#EFE6EB;--s-ac:#8A6B7C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s-red:#d9a2a8;--s-red-bg:#3a2a2d;--s-ok:#9cc9b0;--s-amb:#d8bd8a;--s-amb-bg:#353024;--s-pick:#33282e;--s-ac:#c9a7b8}}
:root[data-theme="dark"]{--s-red:#d9a2a8;--s-red-bg:#3a2a2d;--s-ok:#9cc9b0;--s-amb:#d8bd8a;--s-amb-bg:#353024;--s-pick:#33282e;--s-ac:#c9a7b8}
header h1{font-weight:600}
.mc,.hb2,.hbtn{font-weight:500!important}
.mc.on,.hb2.pri{background:var(--s-pick)!important;color:var(--hdr-ink)!important;border-color:var(--hdr-line)!important;font-weight:600!important}
.mc.on small,.mc small{color:var(--s-ac)!important}
.hb2 .badge,.btn .badge{background:var(--s-pick)!important;color:var(--s-ac)!important;font-weight:600}
.hb2.hot{border-color:var(--qp-line)!important;box-shadow:none}
.cb.pl,.cb.pl.alt,.cb.pl:hover{background:var(--s-pick)!important;box-shadow:inset 3px 0 0 var(--qp-line)}
.sn{color:var(--s-ac);font-weight:600}
.n{font-weight:400}
.ok{color:var(--s-ok);font-weight:400}.no{color:var(--s-red);font-weight:400}
.dot{background:var(--s-red);opacity:.7}.dot.on{background:var(--s-ok)}
.bg{font-weight:500}.bg.B{background:var(--qp-soft);color:var(--muted)}.bg.G{background:#E8ECF2;color:#6F86A3}
.dv{color:var(--s-ac);font-weight:600}
.hd b.f{color:var(--s-ac)}
#dlg{border-top:3px solid var(--s-amb)}
#dlg.red{border-top-color:var(--s-red)}
#dlg h3{color:var(--s-amb);font-weight:600}#dlg.red h3{color:var(--s-red)}
#dlg .note{background:var(--s-amb-bg);color:var(--fg)}
#dlg .note b{font-weight:600;color:var(--s-amb)}
#dlg .over{background:var(--s-red-bg);color:var(--s-red);font-weight:500}
#dlg td.bad{color:var(--s-red);font-weight:600}
#dlg .btn{font-weight:500}
#dlg .btn.go{background:var(--s-red-bg);border-color:var(--s-red);color:var(--s-red)}
#dlg .btn.go.amb{background:var(--s-amb-bg);border-color:var(--s-amb);color:var(--s-amb)}
#dlgW{background:rgba(60,45,52,.12)}
.hd{font-weight:700!important;color:var(--fg)!important;font-size:10.5px!important}.hd>span>b{font-weight:700}
header{gap:6px 8px!important}.mc,.hb2,.hbtn{padding:3px 8px!important}
#toast{background:var(--surface);color:var(--fg);border:1px solid var(--hdr-line);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.foot b{font-weight:600}

/* machine chips with capacity */
.mcs{gap:4px!important}
.mc{display:inline-flex!important;flex-direction:column;align-items:flex-start;gap:2px;padding:4px 8px!important;min-width:84px;border-radius:6px!important;font-size:12.5px!important}
.mc .mh{font-weight:600;white-space:nowrap}
.mc.mcall{justify-content:center;min-width:64px;align-self:stretch}
.mcap{display:inline-flex;align-items:center;gap:2px;font:500 10.5px var(--f-ui);color:var(--muted)}
.mcap input{width:30px;font:600 11px var(--f-ui);border:1px solid var(--line);border-radius:3px;padding:0 2px;text-align:center;background:var(--surface);color:var(--fg);-moz-appearance:textfield}
.mcap input::-webkit-outer-spin-button,.mcap input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
/* list drag + multi-select */
.cb.pl{transition:transform .14s ease,box-shadow .14s ease}
.cb.pl:active{cursor:grabbing}
.cb.drag{opacity:.35!important}
.cb.over{transform:scale(1.015);box-shadow:0 6px 18px rgba(102,67,86,.18)!important;position:relative;z-index:2}
.cb.over.ot{box-shadow:inset 0 3px 0 #664356,0 6px 18px rgba(102,67,86,.18)!important}
.cb.over.ob{box-shadow:inset 0 -3px 0 #664356,0 6px 18px rgba(102,67,86,.18)!important}
.cb.msel,.cb.msel.alt{background:#E2D3DC!important;box-shadow:inset 4px 0 0 #664356!important}
.selinfo{font:600 11.5px var(--f-ui);color:#664356;background:var(--s-pick);border-radius:5px;padding:3px 8px}
.selinfo[hidden]{display:none}
.dghost{position:fixed;top:-100px;left:-100px;background:#664356;color:#fff;font:600 12px var(--f-ui);padding:4px 10px;border-radius:6px}
/* MC board */
.ldy{font-weight:600;color:var(--s-ac)}
.cpy{border:1px solid var(--line);background:var(--surface);color:var(--s-ac);border-radius:4px;font-size:12px;line-height:1;padding:2px 5px;cursor:pointer;margin-left:4px;vertical-align:1px}.cpy:hover{border-color:var(--qp-line);background:var(--s-pick)}
.bcard .stag{font-weight:700;font-size:10px;color:#C0392B}
.bdl{position:sticky;left:158px;display:inline-block}
.bcard .tg{white-space:normal;line-height:1.35}.bcard .tg i{font-style:normal;opacity:.5;margin:0 1px}
#bQ{font:12px var(--f-ui);border:1px solid var(--line);border-radius:5px;padding:3px 8px;width:220px;flex:none;min-width:0;background:var(--surface);color:var(--fg)}
.lgb{border:1px solid transparent;background:transparent;font:inherit;color:inherit;cursor:pointer;border-radius:4px;padding:1px 4px}.lgb:hover{border-color:var(--line)}
.lgb.offg{opacity:.4;text-decoration:line-through}

<body>
<div class="app">
<header>
  <a class="hb2" href="index.html" title="Back to SQ Hues Tools" style="text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap">← Tools</a>
  <span class="hb">
    <button class="hb2" id="refresh" title="Move ticked combos up into the plan by priority">Refresh</button>
    <button class="hb2" id="auto" title="Sort every machine: FOC → Hanger → Line Plan (today, tomorrow, day after, backlog, later dates nearest first) → AOP → Urgent → other Plan Type → rest">Auto-order</button>
    <span class="vseg" id="vseg"><button class="hb2 on" data-v="list">List</button><button class="hb2" data-v="board" title="Machine-wise day board: see the load and drag batches to re-sequence">MC Board</button></span>

<div id="dlgW" hidden><div id="dlg" role="alertdialog" aria-modal="true"></div></div>

<script type="application/json" id="seed">{"label":"No file loaded","data":{"batches":{},"combos":[],"itemsKg":{}}}</script>
<script>
/* MC Loading Planner engine: body/gusset rules (same as Dye Q Combo Planner) applied to the Loading plan Master Sheet. */
(function (root) {
  'use strict';
  // ---------- small helpers ----------
  const unesc = s => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&#(\d+);/g, (m, d) => String.fromCharCode(+d)).replace(/&#x([0-9a-f]+);/gi, (m, h) => String.fromCharCode(parseInt(h, 16))).replace(/&amp;/g, '&');
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const cn = c => { let n = 0; for (const ch of c) n = n * 26 + ch.charCodeAt(0) - 64; return n; };
  const cl = n => { let s = ''; while (n) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; };
  const str = v => (v === null || v === undefined) ? '' : String(v);
  const cmpStr = (a, b) => (a < b ? -1 : a > b ? 1 : 0);

  function parseSST(xml) {
    const out = [];
    if (!xml) return out;
    const re = /<si>([\s\S]*?)<\/si>/g; let m;
    while ((m = re.exec(xml))) {
      let t = ''; const tr = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g; let k;
      while ((k = tr.exec(m[1]))) t += k[1];
      out.push(unesc(t));
    }
    return out;
  }
  // returns Map(row -> {colLetter: value}) for wanted columns
  function readCells(xml, want, sst, fromRow) {
    const rows = new Map();
    const re = /<c r="([A-Z]{1,3})(\d+)"([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let m;
    while ((m = re.exec(xml))) {
      const col = m[1]; if (!want.has(col)) continue;
      const r = +m[2]; if (r < fromRow) continue;
      const attrs = m[3], inner = m[4] || '';
      const tm = /\bt="(\w+)"/.exec(attrs); const t = tm ? tm[1] : null;
      let val = null;
      if (t === 'inlineStr') { let s = ''; const tr = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g; let k; while ((k = tr.exec(inner))) s += k[1]; val = unesc(s); }
      else {
        const vm = /<v>([\s\S]*?)<\/v>/.exec(inner);
        if (vm) {
          if (t === 's') val = sst[+vm[1]];
          else if (t === 'str' || t === 'e' || t === 'b') val = unesc(vm[1]);
          else { const f = parseFloat(vm[1]); val = isNaN(f) ? unesc(vm[1]) : f; }
        }
      }
      let o = rows.get(r); if (!o) { o = {}; rows.set(r, o); }
      o[col] = val;
    }
    return rows;
  }

  // ---------- classification (fabric rules) ----------
  const ELAS = /spandex|lycra|elas|creora|\d+\s*d\b|\/\s*5\b/i;
  const elastic = f => ELAS.test(str(f));
  const gsm = f => { const m = /-\s*(\d{2,3})\s*-\s*\d{2,3}\s*-/.exec(str(f)); return m ? +m[1] : null; };
  const gkey = o => { o = str(o).trim(); return o.includes('+') ? o.split('+').pop().trim() : o; };
  const norm = f => str(f).replace(/\s+/g, '').toLowerCase();
  const isT33 = b => str(b).toUpperCase().replace(/ /g, '').includes('T33');

  function buildOrders(rows280) {
    const orders = new Map(); const seen = new Set();
    for (const r of rows280) {
      const o = r.G, b = r.H, f = r.N, q = r.W;
      if (!o || !f) continue;
      const bk = b === null || b === undefined ? '\u0000null' : b;
      if (seen.has(bk)) continue; seen.add(bk);
      const g = gkey(o); if (!orders.has(g)) orders.set(g, new Map());
      const fm = orders.get(g), k = norm(f);
      if (!fm.has(k)) fm.set(k, { qty: 0, name: null });
      const d = fm.get(k); d.name = f; d.qty += (typeof q === 'number') ? q : 0;
    }
    return orders;
  }
  function classify(orders, order, fabric, buyer) {
    if (buyer && isT33(buyer)) return 'Body';
    const fabs = orders.get(gkey(order)); const key = norm(fabric);
    if (!fabs || !fabs.has(key) || fabs.size === 1) return 'Body';
    const me = fabs.get(key);
    const vals = [...fabs.values()];
    const eAny = vals.map(v => elastic(v.name));
    const anyE = eAny.some(Boolean), allE = eAny.every(Boolean);
    if (anyE && !allE) {
      if (elastic(fabric)) return 'Body';
      const bodyQ = vals.filter(v => elastic(v.name)).reduce((a, v) => a + v.qty, 0);
      return me.qty <= bodyQ * 1.05 ? 'Gusset' : 'Body';
    }
    if (allE) return 'Body';
    let low = null, lk = null;
    for (const v of vals) { const k = [gsm(v.name) || 999, v.qty]; if (!low || k[0] < lk[0] || (k[0] === lk[0] && k[1] < lk[1])) { low = v; lk = k; } }
    const othersMax = Math.max(...[...fabs.entries()].filter(([k]) => k !== key).map(([, v]) => v.qty));
    return (low === me && me.qty <= othersMax) ? 'Gusset' : 'Body';
  }

  // ---------- pairing ----------
  const nshade = s => str(s).toLowerCase().replace(/[^a-z0-9]/g, '');
  function parseB(b) {
    const p = str(b).split('|').map(x => x.trim());
    if (p.length < 3) return null;
    if (!/^[+-]?\d+$/.test(p[1])) return null;
    return { o: p[0], seq: parseInt(p[1], 10), sub: p[2] };
  }
  const subkey = s => s.split('/').map(x => /^\d+$/.test(x) ? +x : 0);
  const cmpArr = (a, b) => { for (let i = 0; i < Math.min(a.length, b.length); i++) { if (a[i] !== b[i]) return a[i] - b[i]; } return a.length - b.length; };
  const kExact = sh => nshade(sh);
  const kMinusG = sh => nshade(str(sh).trim().replace(/[-\s]+g\s*$/i, ''));
  const kStrip = sh => { let t = str(sh).replace(/\b(aop|gusset|gst|body|wing)\b/gi, ''); t = t.trim().replace(/[-\s]+g\s*$/i, ''); t = t.trim().replace(/[-\s]+(g|b)\s*$/i, ''); return nshade(t); };
  const kCode = sh => { const m = /\d{4,6}/.exec(str(sh)); return m ? m[0] : null; };
  const LEVELS = [['exact', kExact], ['minusG', kMinusG], ['stripped', kStrip], ['code', kCode]];
  const GSUF = /[-\s]g\s*$/i;
  const isG = sh => GSUF.test(str(sh));

  function buildModel(rows280) {
    const orders = buildOrders(rows280);
    const rows = new Map(); // batch -> data
    for (const r of rows280) {
      const b = r.H; if (!b || rows.has(b)) continue;
      const p = parseB(b); if (!p) continue;
      rows.set(b, { buyer: r.E, po: str(r.F).trim(), order: r.G, shade: r.L, fab: r.N, qty: r.W || 0, pos: r.BB, o: p.o, seq: p.seq, sub: p.sub });
    }
    for (const d of rows.values()) d.type = classify(orders, d.order, d.fab, d.buyer);
    // items
    const IK = (po, o, seq) => po + '\u0001' + o + '\u0001' + seq;
    const items = new Map(); // key -> {po,o,seq,batches:[]}
    for (const [b, d] of rows) {
      const k = IK(d.po, d.o, d.seq);
      if (!items.has(k)) items.set(k, { key: k, po: d.po, o: d.o, seq: d.seq, batches: [] });
      items.get(k).batches.push(b);
    }
    const itype = new Map(), ishade = new Map();
    for (const it of items.values()) {
      const cnt = new Map(); let best = null, bc = 0;
      for (const b of it.batches) { const t = rows.get(b).type; cnt.set(t, (cnt.get(t) || 0) + 1); }
      for (const [t, c] of cnt) if (c > bc) { best = t; bc = c; }
      itype.set(it.key, best); ishade.set(it.key, rows.get(it.batches[0]).shade);
    }
    const itT33 = k => isT33(rows.get(items.get(k).batches[0]).buyer);
    for (const k of items.keys()) {
      if (isG(ishade.get(k)) && !itT33(k)) itype.set(k, 'Gusset');
      if (itT33(k)) itype.set(k, 'Body');
    }
    const cmatch = (a, b) => LEVELS.some(([, kf]) => { const x = kf(a); return x && x === kf(b); });
    const sortedItems = [...items.values()].sort((a, b) => cmpStr(a.po, b.po) || cmpStr(a.o, b.o) || (a.seq - b.seq));
    const byOS = (a, b) => cmpStr(a.o, b.o) || (a.seq - b.seq);

    function runPairing() {
      const ip = new Map(), taken = new Set();
      for (const gi of sortedItems) {
        if (itype.get(gi.key) !== 'Gusset') continue;
        const bk = IK(gi.po, gi.o, gi.seq - 1);
        if (itype.has(bk) && itype.get(bk) === 'Body' && !taken.has(bk) && cmatch(ishade.get(gi.key), ishade.get(bk))) {
          ip.set(gi.key, bk); ip.set(bk, gi.key); taken.add(bk);
        }
      }
      for (const [, kf] of LEVELS) {
        const grp = new Map();
        for (const it of items.values()) {
          const k = kf(ishade.get(it.key)); if (!k) continue;
          const gk = it.po + '\u0002' + k; if (!grp.has(gk)) grp.set(gk, []); grp.get(gk).push(it);
        }
        for (const its of grp.values()) {
          let bodies = its.filter(i => itype.get(i.key) === 'Body' && !taken.has(i.key)).sort(byOS);
          const gus = its.filter(i => itype.get(i.key) === 'Gusset' && !ip.has(i.key)).sort(byOS);
          if (!bodies.length || !gus.length) continue;
          for (const gi of gus) {
            bodies = bodies.filter(b => !taken.has(b.key));
            if (!bodies.length) break;
            const same = bodies.filter(b => b.o === gi.o && b.seq < gi.seq);
            let bi;
            if (same.length) { bi = same[0]; for (const s of same) if (s.seq > bi.seq) bi = s; }
            else {
              const sameo = bodies.filter(b => b.o === gi.o);
              const pool = sameo.length ? sameo : bodies;
              const cand = sameo.length ? gus.filter(x => x.o === gi.o) : gus;
              bi = pool[Math.min(cand.indexOf(gi), pool.length - 1)];
            }
            ip.set(gi.key, bi.key); ip.set(bi.key, gi.key); taken.add(bi.key);
          }
        }
      }
      return ip;
    }
    let pair = null;
    for (let i = 0; i < 5; i++) {
      pair = runPairing();
      const ribbody = k => { if (!pair.has(k)) return false; const bk = pair.get(k); return /\brib/i.test(str(rows.get(items.get(bk).batches[0]).fab)); };
      const demote = [...items.keys()].filter(k => itype.get(k) === 'Gusset' && !isG(ishade.get(k)) && (!pair.has(k) || ribbody(k)));
      if (!demote.length) break;
      for (const k of demote) itype.set(k, 'Body');
    }
    const finalType = b => { const d = rows.get(b); return d ? itype.get(IK(d.po, d.o, d.seq)) : null; };
    const partner = b => {
      const d = rows.get(b); if (!d) return null;
      const k = IK(d.po, d.o, d.seq); if (!pair.has(k)) return null;
      const pbs = items.get(pair.get(k)).batches;
      const same = pbs.filter(x => parseB(x).sub === d.sub);
      if (same.length) return same[0];
      return [...pbs].sort((a, b) => cmpArr(subkey(parseB(a).sub), subkey(parseB(b).sub)))[0];
    };
    return { orders, rows, finalType, partner, classify: (o, f, b) => classify(orders, o, f, b) };
  }

  // ---------- MC ----------
  const MC = [[4, 10, '10 Kg MC', true], [18, 39, '30 Kg MC', false], [39, 62, '60 Kg MC', true], [80, 125, '120 Kg MC', true],
    [135, 201, '200 Kg MC', false], [201, 262, '250 Kg MC', true], [350, 521, '500 Kg MC', false], [521, 770, '750 Kg MC', true]];
  const mc = q => { for (const [lo, hi, lab, inc] of MC) if (inc ? (q >= lo && q <= hi) : (q >= lo && q < hi)) return lab; return 'Need Batch Plan'; };
  // workbook plumbing
  // ---------- workbook plumbing ----------
  async function sheetPaths(zip) {
    const wb = await zip.file('xl/workbook.xml').async('string');
    const rels = await zip.file('xl/_rels/workbook.xml.rels').async('string');
    const relMap = {}; let m; const rr = /<Relationship\b([^>]*)\/>/g;
    while ((m = rr.exec(rels))) { const id = /Id="([^"]+)"/.exec(m[1]), t = /Target="([^"]+)"/.exec(m[1]); if (id && t) relMap[id[1]] = t[1]; }
    const out = {}; const sr = /<sheet\b([^>]*)\/>/g; let idx = 0;
    while ((m = sr.exec(wb))) {
      const name = unesc(/name="([^"]+)"/.exec(m[1])[1]); const rid = /r:id="([^"]+)"/.exec(m[1])[1];
      let t = relMap[rid]; t = t.startsWith('/') ? t.slice(1) : 'xl/' + t.replace(/^\.\//, '');
      out[name] = { path: t, index: idx++ };
    }
    return out;
  }

  // ---------- Loading plan (Master Sheet) ----------
  const MCS = ['750','500','250','200','120','60','30','10'];
  const mcKey = q => { const l = mc(q); return l === 'Need Batch Plan' ? 'NBP' : l.split(' ')[0]; };
  const xlDate = v => { if (typeof v !== 'number' || v < 20000 || v > 80000) return ''; const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v * 86400000)); return d.toISOString().slice(0, 10); };
  async function parseLoadingPlan(JSZip, input, log = () => {}) {
    const zip = await JSZip.loadAsync(input);
    const sp = await sheetPaths(zip);
    if (!sp['Master Sheet'] || !sp['280']) throw new Error('This file needs a "Master Sheet" and a "280" sheet (the daily Loading plan workbook).');
    log('Reading shared strings…');
    const sstFile = zip.file('xl/sharedStrings.xml');
    const sst = parseSST(sstFile ? await sstFile.async('string') : '');
    log('Reading 280 sheet…');
    const x280 = await zip.file(sp['280'].path).async('string');
    const c280 = readCells(x280, new Set(['E', 'F', 'G', 'H', 'L', 'N', 'W', 'AB', 'BB', 'BC', 'BF']), sst, 3);
    const rows280 = [...c280.entries()].sort((a, b) => a[0] - b[0]).map(([r, o]) => o);
    log('Matching body and gusset…');
    const M = buildModel(rows280);
    log('Reading Master Sheet…');
    const xm = await zip.file(sp['Master Sheet'].path).async('string');

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
// Plan Date: tick → today (or back to the file's own date); untick → blank (file date cleared on export)
function setPlanDate(c,on){
  for(const b of c.m){ const x=D.batches[b]; if(!x) continue; const e=S.ed[b]=S.ed[b]||{};
    const orig=('pd0' in e)?e.pd0:(x.pd||'');
    if(on){ if(orig){ x.pd=orig; delete e.pd; delete e.pd0; } else { e.pd0=''; e.pd=today(); x.pd=e.pd; } }
    else { if(orig){ e.pd0=orig; e.pd=''; } else { delete e.pd; delete e.pd0; } x.pd=''; }
    if(!Object.keys(e).length) delete S.ed[b];
  }
}
function toggle(id,ok){
  const c=C.get(id), L=mlist(c);
  if(L.includes(id)){ S.plan[c.mc]=L.filter(x=>x!==id); setPlanDate(c,false); }
  else { if(!ok&&checkPlan(c)) return; let pos=L.findIndex(x=>cmpAuto(C.get(x),c)>0); if(pos<0) pos=L.length; L.splice(pos,0,id); setPlanDate(c,true); }
  pending++; save(); draw();
}
// ---------- checks before planning: KBL / LD pending, and 102% Req Qty Kg ----------
const f0=v=>fmt(Math.round(v));
function plannedKg(ik,skip){ let t=0; for(const k in S.plan) for(const id of S.plan[k]||[]){ const c=C.get(id); if(!c) continue; for(const x of c.p) if(x.ik===ik&&!skip.has(x.b)) t+=x.q||0; } return t; }
function checkPlan(c){
  const notes=[];
  for(const x of c.p){
    const tag=c.p.length>1?`<b>${x.t==='G'?'Gusset':'Body'}</b> `:'';
    if(x.kn==='KBL') notes.push(`${tag}${esc(x.b)}: <b>knitting balance (KBL)</b> — knitting is not complete.`);
    if(!String(x.ld||'').trim()) notes.push(`${tag}${esc(x.b)}: <b>LD pending</b> — no LD / matching reference.`);
  }
  if(!D.itemsKg&&!checkPlan.w){checkPlan.w=1;toast('Load the file again to turn on the 102% Req Qty Kg check.');}
  const rows=[]; const skip=new Set(c.m); const seen={};
  if(D.itemsKg) for(const x of c.p){
    const it=D.itemsKg[x.ik]; if(!it) continue;
    const [bal,wip]=it; const pl=plannedKg(x.ik,skip)+(seen[x.ik]||0); const tot=wip+pl+(x.q||0); seen[x.ik]=(seen[x.ik]||0)+(x.q||0);
    if(tot>bal+0.5) rows.push({x,bal,wip,pl,tot});
  }
  if(!notes.length&&!rows.length) return false;
  const red=rows.length>0;
  if(!red){ // KBL / LD pending: plan it, then show a message
    setTimeout(()=>{const d=$('dlg'); d.className=''; d.innerHTML=`<h3>Planned — please note</h3>${notes.map(n=>`<div class="note">${n}</div>`).join('')}<div class="acts"><button class="btn go amb" id="dlgY">OK</button></div>`; $('dlgW').hidden=false; $('dlgY').focus(); $('dlgY').onclick=()=>{$('dlgW').hidden=true;};},0);
    return false;
  }
  const tbl=red?`<div class="over">Batch qty will go over the 102% Req Qty Kg. This batch is on hold.</div><table><tr><th>Batch</th><th>102% Req Qty Kg</th><th>In process</th><th>Already planned</th><th>This batch</th><th>Total</th><th>Over by</th></tr>${rows.map(r=>`<tr><td>${c.p.length>1?`<span class="bg ${r.x.t}">${r.x.t}</span> `:''}${esc(r.x.b)}</td><td>${f0(r.bal)}</td><td>${f0(r.wip)}</td><td>${f0(r.pl)}</td><td>${f0(r.x.q)}</td><td class="bad">${f0(r.tot)}</td><td class="bad">${f0(r.tot-r.bal)}</td></tr>`).join('')}</table><div class="mut" style="font-size:11px">All in kg, for the same order item; 102% Req Qty Kg is from the 280 sheet (${esc(rows[0].x.ik)}${rows.length>1?' …':''}). In process = dyed batches not yet RFD. Already planned = batches ticked in this planner.</div>`:'';
  const d=$('dlg'); d.className=red?'red':'';
  d.innerHTML=`<h3>${red?'Hold — over 102% Req Qty Kg':'Check before planning'}</h3>${notes.map(n=>`<div class="note">${n}</div>`).join('')}${tbl}<div class="acts"><button class="btn" id="dlgN">Cancel</button><button class="btn go${red?'':' amb'}" id="dlgY">${red?'Proceed anyway':'Plan anyway'}</button></div>`;
  $('dlgW').hidden=false; $('dlgN').focus();
  $('dlgN').onclick=()=>{$('dlgW').hidden=true;};
  $('dlgY').onclick=()=>{$('dlgW').hidden=true; toggle(c.id,true); toast(red?'Planned over the 102% Req Qty Kg.':'Planned.');};
  return true;
}

// Auto-order: 1 FOC · 2 Hanger (both by Plan Date) · 3 Line Plan: today, tomorrow, day after, then backlog oldest→newest, then later dates
//             4 AOP (shade says AOP) · 5 Urgent · 6 other Plan Type comments · 7 rest — groups 4–7 by Plan Date, then OTT
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const AUTO_NOTE='Auto-ordered: FOC → Hanger → Line Plan (today, tomorrow, day after, backlog, later dates nearest first) → AOP → Urgent → other Plan Type → rest.';
function autoKey(c,simple){
  const t0=addDays(0),t1=addDays(1),t2=addDays(2);
  const first=f=>c.p.map(f).filter(Boolean).sort()[0]||'';
  const lp=first(x=>x.lp), pd=first(x=>x.pd)||'9999', ott=first(x=>x.ott)||'9999';
  const has=re=>c.p.some(x=>re.test(x.pt||'')||re.test(x.cat||''));
  let g,sub=0,d=pd;
  if(has(/FOC/i)) g=0;
  else if(has(/HANGER/i)) g=1;
  else if(lp){ g=2; d=lp; if(!simple) sub=lp===t0?0:lp===t1?1:lp===t2?2:lp<t0?3:4; }  // planned: today, tomorrow, day after, backlog, later · not planned: oldest first
  else if(c.p.some(x=>/AOP/i.test(x.sh||''))) g=3;
  else if(c.p.some(x=>/URGENT/i.test(x.pt||''))) g=4;
  else if(c.p.some(x=>String(x.pt||'').trim())) g=5;
  else g=6;
  return [g,sub,d,ott];
}

function bcard(c,sl,day){

  const lp=c.p.map(y=>y.lp).filter(Boolean).sort()[0]||''; const back=!!(lp&&lp<addDays(0)); const late=!!(lp&&day&&day>lp&&!back);
  BINFO[c.id]={sl,day,lp,late,back,over,warn};

  return (tg.length||st.length)?`<div class="s tg">${tg.map(t=>`<span class="gtag${t==='FOC'?' foc':''}">${esc(t)}</span>`).join('<i>/</i>')}${st.map(t=>` <span class="stag">${t}</span>`).join('')}</div>`:'';})()}<div class="s">${esc(x.by)} · ${fmt(Math.round(c.q))} kg</div><div class="s">${lp?`<span class="lpd">LP ${dshort(lp)}</span> · `:''}${esc(x.sh)}</div>${warn?'<span class="k" style="background:#C9A35A"></span>':''}</div>`;

// all labels of a combo: main group first, then FOC / Hanger / Line Plan / AOP / Urgent / other Plan Type words / Additional / Last Batch
function tagsOf(c){
  const out=[]; const add=t=>{t=String(t||'').trim(); if(!t) return; const u=t.toUpperCase(); if(!out.some(o=>o.toUpperCase()===u)) out.push(t);};
  const nice=t=>{const u=t.trim().toUpperCase(); return u==='FOC'?'FOC':u==='AOP'?'AOP':u==='PSI'?'PSI':u==='LINE PLAN'?'Line Plan':u.toLowerCase().replace(/\b\w/g,ch=>ch.toUpperCase());};
  const g=Math.min(autoKey(c)[0],6);
  const pts=[]; for(const y of c.p) for(const t of String(y.pt||'').split('/')) if(t.trim()) pts.push(nice(t));
  const cats=[]; for(const y of c.p) if(String(y.cat||'').trim()) cats.push(nice(y.cat));
  const all=[...pts,...cats]; const hasW=w=>all.some(t=>t.toUpperCase()===w.toUpperCase());
  const aop=c.p.some(y=>/AOP/i.test(y.sh||''))||hasW('AOP'); const lp=c.p.some(y=>y.lp)||hasW('Line Plan');
  if(g===0) add('FOC'); else if(g===1) add('Hanger'); else if(g===2) add('Line Plan'); else if(g===3) add('AOP'); else if(g===4) add('Urgent'); else if(g===5) add(pts[0]||'Others');
  if(hasW('FOC')) add('FOC'); if(hasW('Hanger')) add('Hanger'); if(lp) add('Line Plan'); if(aop) add('AOP'); if(hasW('Urgent')) add('Urgent');
  for(const t of all) add(t);
  return out;
}

  $('busy').textContent='Writing your file…';
  try{
    const {out}=await LPEngine.writePlan(JSZip,FILE.buf.slice(0),ed,order);
    $('busy').textContent='';
    const name=LABEL.replace(/[\\/:*?"<>|]/g,'');
    if(window.claude&&window.claude.use){
      try{ const dl=await window.claude.use('downloads'); if(dl){ await dl.save({filename:name,data:out}); toast('Saved '+name+' — '+n+' SL planned.'); return; } }
      catch(e){ if(e&&e.code==='declined'){toast('Save cancelled.');return;} toast('Could not save the file here ('+(e&&e.code||'error')+').'); return; }
    }
    const a=document.createElement('a'); a.href=URL.createObjectURL(out); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
  }catch(err){ console.error(err); $('busy').textContent=''; toast('Could not write the file: '+(err.message||err)); }
});

// ---------- load a new day's file ----------
$('loadBtn').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('fileIn').click();}});
$('fileIn').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f)return; e.target.value='';
  if(!window.JSZip){toast('The file reader library did not load. Check the internet connection and reload.');return;}
  $('busy').textContent='Reading '+f.name+'…';
  try{
    const buf=await f.arrayBuffer();
    const d=await LPEngine.parseLoadingPlan(JSZip,buf.slice(0),m=>{$('busy').textContent=m;});
    FILE={label:f.name,buf}; IDB.put(FILE);
    const before=MCS.reduce((a,k)=>a+(S.plan[k]||[]).length,0);
    D=d; LABEL=f.name; store.set('mclp-data',{label:LABEL,data:D}); S.plan={}; S.ed={}; S.over={}; build(); const nf=MCS.reduce((a,k)=>a+(S.plan[k]||[]).length,0); S.seeded=LABEL;
    save(); refreshView(); $('busy').textContent='';
    toast(`Loaded ${f.name}. ${nf} SL with a Plan Date are planned, in the file's M/C and SL order.`);
  }catch(err){ console.error(err); $('busy').textContent=''; toast('Could not read this file: '+(err.message||err)); }
});

build(); if(S.seeded!==LABEL){ S.plan={}; S.ed={}; S.seeded=LABEL; build(); } save(); refreshView();
})();
</script>
